name: Validate

on:
  push:
    branches: [master, dev]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3

      - name: "HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"

      - name: "Hassfest validation"
        # Run it even when the HACS check fails (e.g. while the repository is
        # private, which HACS does not support).
        if: ${{ !cancelled() }}
        uses: home-assistant/actions/hassfest@master
